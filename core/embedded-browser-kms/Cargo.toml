[package]
name = "aws-emulator-embedded-browser-kms"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
http = { workspace = true }
bytes = { workspace = true }
engine = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
service-com-amazonaws-kms-trentservice = { workspace = true }
# WASM-EMBEDDED EXPERIMENT: see core/embedded-browser/Cargo.toml for why these two
# dependencies are split by target.
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc", "std", "bitflags"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
