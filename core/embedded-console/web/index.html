<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AWS Emulator Console</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>AWS Emulator Console</h1>
  <p class="subtitle">Each service keeps its own in-browser state while you switch tabs.</p>
</header>
<nav class="service-nav">
  <button type="button" data-service="secretsmanager" class="active">Secrets Manager</button>
  <button type="button" data-service="kms">KMS</button>
  <button type="button" data-service="sts">STS</button>
  <button type="button" data-service="iam">IAM</button>
</nav>

<main class="shell-main">
  <iframe class="service-frame" data-service="secretsmanager" data-src="secretsmanager.html" title="Secrets Manager"></iframe>
  <iframe class="service-frame" data-service="kms" data-src="kms.html" title="KMS" hidden></iframe>
  <iframe class="service-frame" data-service="sts" data-src="sts.html" title="STS" hidden></iframe>
  <iframe class="service-frame" data-service="iam" data-src="iam.html" title="IAM" hidden></iframe>
</main>

<script type="module" src="shell.js"></script>
</body>
</html>
