[package]
name = "aws-emulator-embedded-console"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# A plain `rlib`: ONLY a library, no `cdylib`. Every `embedded-*` crate's own
# `#[wstd::http_server]`-attributed `main` generates one `wasi:http/incoming-handler`
# export symbol for ITS component; if this crate also carried a `cdylib` output with
# its OWN such export (as it briefly did), that export would be pulled into — and
# collide with — every dependent's final linked wasm binary.
crate-type = ["rlib"]

[dependencies]
http = { workspace = true }
bytes = { workspace = true }
# WASM-EMBEDDED EXPERIMENT: see core/embedded-secretsmanager/Cargo.toml for why these
# two dependencies are split by target.
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wstd = { workspace = true }

[features]
# Serves the already-built wasm32-wasip3 components natively with the `wasmtime`
# embedding API (no browser, no `wasmtime` CLI subprocess) -- see src/bin/serve_native.rs.
native-serve = [
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "dep:wasmtime-wasi-http",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:futures",
]

[dependencies.wasmtime]
version = "51"
optional = true

[dependencies.wasmtime-wasi]
version = "51"
optional = true

[dependencies.wasmtime-wasi-http]
version = "51"
optional = true

[dependencies.hyper]
version = "1"
features = ["http1", "server"]
optional = true

[dependencies.hyper-util]
version = "0.1"
features = ["tokio"]
optional = true

[dependencies.http-body-util]
version = "0.1"
optional = true

[dependencies.futures]
version = "0.3"
optional = true

[[bin]]
name = "serve_native"
path = "src/bin/serve_native.rs"
required-features = ["native-serve"]

[build-dependencies]
# Transpiles a component straight to JS/TS in-process: the same engine `jco transpile`
# (its CLI) drives, called directly from Rust so `build.rs` needs no Node/npm — see
# `build.rs` for why that matters (the bare `jco` package on npm is an unrelated
# dependency-confusion placeholder; nothing here resolves it by name at all now).
js-component-bindgen = "2"
