[package]
name = "aws-emulator-embedded-console"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# A plain `rlib`: ONLY a library, no `cdylib`. Every `embedded-*` crate's own
# `#[wstd::http_server]`-attributed `main` generates one `wasi:http/incoming-handler`
# export symbol for ITS component; if this crate also carried a `cdylib` output with
# its OWN such export (as it briefly did), that export would be pulled into — and
# collide with — every dependent's final linked wasm binary.
crate-type = ["rlib"]

[dependencies]
http = { workspace = true }
bytes = { workspace = true }
# WASM-EMBEDDED EXPERIMENT: see core/embedded-secretsmanager/Cargo.toml for why these
# two dependencies are split by target.
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wstd = { workspace = true }

[build-dependencies]
# Transpiles a component straight to JS/TS in-process: the same engine `jco transpile`
# (its CLI) drives, called directly from Rust so `build.rs` needs no Node/npm — see
# `build.rs` for why that matters (the bare `jco` package on npm is an unrelated
# dependency-confusion placeholder; nothing here resolves it by name at all now).
js-component-bindgen = "2"
