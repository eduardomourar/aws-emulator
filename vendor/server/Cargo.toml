[package]
name = "aws-emulator-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
http = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
# WASM-EMBEDDED EXPERIMENT: wasm32 targets only build tokio's wasm-safe feature subset
# (sync, macros, io-util, rt, time); "full" (net, fs, process, rt-multi-thread, signal, ...)
# is added back below for every other target.
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
aws-smithy-runtime-api = { version = "1.11.3", features = ["client", "http-1x"] }
aws-smithy-types = "1"
http-body-util = "0.1.3"
# WASM-EMBEDDED EXPERIMENT: axum's default features pull in its own "tokio" feature, which
# in turn demands tokio's "net" (sockets) — not needed here, since nothing in this crate
# calls `axum::serve`; `axum_server` (native-only, below) drives serving itself.
axum = { version = "0.8", default-features = false }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
aws-sigv4 = { version = "1", features = ["http1"] }
aws-credential-types = "1"
aws-lc-rs = "1"
percent-encoding = "2"
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"] }
emulator-paths = { path = "../emulator-paths", package = "aws-emulator-emulator-paths", version = "*" }
emulator-telemetry = { path = "../emulator-telemetry", package = "aws-emulator-emulator-telemetry", version = "*" }
aws-smithy-schema-server = { path = "../smithy-schema-server", package = "aws-emulator-smithy-schema-server", version = "*" }

# WASM-EMBEDDED EXPERIMENT: real sockets, TLS listeners and the standalone server binary
# only exist off wasm32 — `listeners.rs`/`tls_certificate_authority.rs`/`java_truststore.rs`
# are cfg'd out for wasm32 in src/lib.rs, so these crates are never referenced there either.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
tokio-rustls = "0.26"
yasna = "0.5"
