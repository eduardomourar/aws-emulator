[package]
name = "service-com-amazonaws-athena-amazonathena"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# Athena's `AwsDataCatalog` IS the account's Glue Data Catalog, so the metadata
# operations read the databases and tables out of Glue's own store rather than keeping a
# second copy of them here.
service-com-amazonaws-glue-awsglue = { workspace = true }
# The object store two things here reach: the DATA a catalog table reads is the objects at
# its location, so a query over such a table reads them out of it; and a notebook imported
# from a `NotebookS3LocationUri` IS the object that location names, so the import reads it
# out of the one object store this emulator has rather than reporting success for content
# nothing holds.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# `page_tokens`: the authenticated continuation token every paginated read here hands
# back, so a `NextToken` this process did not mint names no page; `iam_authorization`: the
# ONE evaluation of IAM policy documents against a request, which is what decides whether
# the caller may act on the workgroup it named.
service-common = { path = "../common" }
# The identity-based policies in force on the calling principal, and the permissions
# boundary that caps them, read through IAM's own accessors: a workgroup is an IAM resource,
# so an Athena action on one is authorized against the documents that store holds.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# Which principal the request's access key id speaks for — the session STS minted it for,
# the same record `sts:GetCallerIdentity` answers from — so the identity a refusal blames is
# the one the caller reads back for the credentials it signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The SQL engine a query execution RUNS on, in-process.
#
# MEMORY-SAFETY POSTURE: the rationale, the bounds and the alternatives considered are
# recorded in this crate's README.md, section "The SQL engine, and its memory-safety
# posture". In short: this crate contains no `unsafe` and keeps the workspace's
# `unsafe_code = "forbid"` lint; the native component the `bundled` feature links is the
# SAME engine the workspace already links through `vendor/emulator-telemetry`
# (`rusqlite` 0.41, `bundled`), so no new native library enters the emulator process.
#
# CAPABILITY: this is an EXECUTION SUBSTRATE — it compiles caller-supplied SQL into
# instructions and runs them — and a NATIVE component: `bundled` makes libsqlite3-sys
# compile the SQLite C amalgamation at build time and link it in. Every host-filesystem
# escape it would otherwise re-open (`ATTACH DATABASE '<path>'`, `VACUUM INTO '<path>'`, a
# `PRAGMA` that re-enables a switch, extension loading, a virtual-table module) is closed
# in `Database::open` in src/state/query_engine.rs, before any request reaches the engine:
# default-deny authorizer, `SQLITE_LIMIT_ATTACHED = 0`, defensive mode, untrusted schema,
# no URI filenames, `temp_store = MEMORY`, `max_page_count`, `hard_heap_limit`, plus
# length, column, depth and compound-select limits. `limits` and `hooks` are the features
# those controls need; `load_extension` is deliberately absent. `functions` registers ONE
# function of this crate's own on each connection — the exact-decimal reading of a value
# (`state::query_engine::exact_decimal`), which computes in this process over the digits a
# value carries and reaches nothing outside the database.
#
# PINNED at 0.41, the release reviewed and built here: it is the first one whose
# `libsqlite3-sys` (0.39) carries a SQLite C library without RUSTSEC-2026-0459 (a
# page-cache disclosure through an undersized-page WAL file, fixed in SQLite 3.54.0),
# which 0.37's `libsqlite3-sys` 0.35 shipped. The two components 0.41 adds —
# `sqlite-wasm-rs` and its `rsqlite-vfs` — are gated to `wasm32` upstream and are not
# linked into a host build, so the engine in the process is still one bundled SQLite.
# The linked release is asserted against that floor by the engine-release suite of
# `services/service-com-amazonaws-rdsdata-rdsdataservice`.
rusqlite = { version = "0.41", features = [
    "bundled",
    "column_decltype",
    "functions",
    "hooks",
    "limits",
] }
# `bigdecimal`: Athena's `DECIMAL` is an EXACT fixed-point type, which the embedded engine
# has no counterpart for — its numeric reading of a value is an integer or a binary double —
# so such a value is carried as the digits it has and read to its declared scale by this
# arbitrary-precision decimal (`state::query_engine::exact_decimal`), the same library the
# emulator's other exact-numeric engines use.
bigdecimal = "0.4"
# `regex`: the pattern a `SHOW TABLES`/`SHOW VIEWS` statement narrows its answer by is
# matched by the linear-time matcher the Data Catalog's own listings use, not by a
# hand-rolled one.
regex = "1.13"
# `csv`: the objects under a table's location are DELIMITED TEXT, so the records and
# fields a read decodes out of them are read by the maintained reader for that format
# rather than by a splitter written here — the separator, the quoting and the line
# terminators come from the table's own SerDe.
csv = "1.4"
# `parquet`: the objects under a table whose storage descriptor names the columnar Parquet
# format ARE Parquet files, so the records a read decodes out of them are read by the Apache
# implementation of that format — the same one this workspace already writes such objects
# with. Pure Rust, like the codecs it needs: `snap` reads a `SNAPPY`-compressed object and
# `flate2` a `GZIP`-compressed one, which are the two compressions a writer of these objects
# chooses between.
parquet = { version = "60", default-features = false, features = [
    "snap",
    "flate2-rust_backend",
] }
# The codecs an object of a TEXT table can be compressed with, chosen by the extension of
# the object's own key before the text SerDe reads it
# (`state::catalog_sql::data::text_codecs`). Each one is read by the maintained decoder for
# that compression, and each is pure Rust — the emulator links no native compression library:
# `flate2` reads the gzip and zlib streams `.gz` and `.deflate` name, `bzip2` (over the Rust
# port of libbz2) the `.bz2` stream, `ruzstd` the `.zst` stream, and `snap` and `lz4_flex` the
# raw chunks the block-framed `.snappy` and `.lz4` objects carry.
flate2 = "1"
bzip2 = "0.6"
ruzstd = "0.9"
snap = "1"
lz4_flex = "0.14"
# `chrono`: a Parquet date or timestamp leaf carries a count of days, milliseconds or
# microseconds from the epoch, and the calendar text a `date` or `timestamp` column holds it
# as is read from a maintained date library rather than computed here.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `StatementType` is read off the PARSE of the submitted SQL rather than off its leading
# word, with the maintained parser this workspace already uses for caller-supplied SQL.
sqlparser = { version = "0.59", features = ["visitor"] }
# Mints the version-4 UUID a `QueryExecutionId` is.
uuid = { version = "1", features = ["v4"] }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): every state a query execution moves into is published onto
# the account's default event bus (`state::query_events`), which is how a client reacts to a
# query settling without polling Athena. Only the generated client is needed — the emulator
# supplies the transport, so the SDK's own HTTPS stack and runtime are left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# Renders the authenticated bytes of a page token, and a binary result value, as hex.
hex = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# WASM-EMBEDDED EXPERIMENT: `workspace = true` ADDS to (not replaces) the workspace's base
# tokio spec, which includes `rt-multi-thread` -- unsupported on wasm32 -- so this is split
# the same way vendor/server's Cargo.toml is.
tokio = { version = "1", features = ["rt", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs`, so a suite is picked up by being there.
automod = { workspace = true }
sha2 = { workspace = true }
# Lake Formation, mounted beside Athena, Glue and Amazon S3 on one engine in the
# lake-formation suite: a query over a governed Data Catalog table is answered from the
# permissions that service holds, so without it mounted there is nothing governing the read.
# It depends on the Glue crate rather than on this one, so it is a dev-dependency here.
service-com-amazonaws-lakeformation-awslakeformation = { workspace = true }
# The query-lifecycle suite waits out the span a started query's completion is due
# after, so it needs the timer driver as well as the runtime.
tokio = { workspace = true, features = ["time"] }
# A query execution's state changes are published onto the account's default EventBridge bus
# and routed from there, so the suite that asserts them mounts EventBridge and Amazon SQS
# beside Athena on ONE engine and reads each event back off the queue a rule delivered it to —
# the same path a client's own rule takes.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[lints]
workspace = true
