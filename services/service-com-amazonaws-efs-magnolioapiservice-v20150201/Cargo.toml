[package]
name = "service-com-amazonaws-efs-magnolioapiservice-v20150201"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# Plain, not `workspace = true`: the workspace's own tokio entry ADDS "rt-multi-thread"
# (and "macros") on top of whatever a dependent lists, and `tokio` itself refuses to build
# "rt-multi-thread" for `wasm32`. The native extra is restored below instead.
tokio = { version = "1" }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# The tree's one reading of the IAM JSON policy language and its one evaluation of a
# resource policy against a request, for `PutFileSystemPolicy`'s document grammar and its
# policy-lockout safety check.
service-common = { path = "../common" }
# The one regex engine in this tree that compiles the look-around two of this service's
# modelled `@pattern` expressions (`Path`, `TagKey`) are written with.
fancy-regex = "0.16"
tracing = { workspace = true }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the subnet a `CreateMountTarget` places a mount target in
# — and that subnet's VPC, Availability Zone and address range — are EC2's resources, so
# `src/state/ec2_subnets.rs` asks EC2 what the account has rather than deciding it here.
# Only the generated client is needed; the emulator supplies the transport and credentials.
aws-sdk-ec2 = { version = "1", default-features = false }
# `ipnet`: the ONE reading of a subnet's CIDR block — which addresses it can assign to a
# mount target, and whether an address a request named lies inside it.
ipnet = "2"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The EC2 service, mounted beside this one in the test harness: that a mount target is
# placed in a subnet the account really has can only be driven end to end with the owner of
# subnets on the same engine. DEV-ONLY: this crate depends on no other service's crate
# outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# Lets a suite assert a minted id or ARN against the pattern a consuming service's model
# carries for it, written out as that model writes it.
regex = "1.13"

[lints]
workspace = true
