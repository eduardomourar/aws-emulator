[package]
name = "service-com-amazonaws-elasticache-amazonelasticachev9"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# WASM-EMBEDDED EXPERIMENT: `workspace = true` ADDS to (not replaces) the workspace's base
# tokio spec, which includes `rt-multi-thread` -- unsupported on wasm32 -- so this is split
# the same way vendor/server's Cargo.toml is.
tokio = { version = "1", features = ["io-util", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex is the codec the opaque pagination `Marker` is built with, and the one the
# reserved-cache-node offering ids are rendered in (src/state.rs).
hex = { workspace = true }
# SHA-256 derives each reserved-cache-node offering's id from its attributes, so
# the published catalog needs no counter and reports the same id on every read
# (src/state.rs), and mints the per-response correlation id the awsQuery error
# envelope carries (src/service/query_error_envelope.rs).
sha2 = { workspace = true }
# The KMS client a `KmsKeyId` is resolved to its key's ARN through, over the
# in-process callback into this same emulator (src/state/kms_key.rs); no network
# client feature is enabled, because the transport is the emulator's own.
# WASM-EMBEDDED EXPERIMENT: "rt-tokio" unconditionally sets `tokio?/fs` (aws-smithy-types'
# own feature definition, not ours to change), unsupported on wasm32; dropped here and
# added back only for native below.
aws-sdk-kms = { version = "1", default-features = false, features = ["behavior-version-latest"] }
# The AWS SDK for EC2, driven over the same in-process callback: the subnets a
# cache subnet group or a serverless cache is placed in are EC2's resources, so
# `src/state/ec2_subnets.rs` asks EC2 what the account has rather than deciding
# it here. Only the generated client is needed — the emulator supplies the
# transport — and `behavior-version-latest` is what `BehaviorVersion::latest()`
# in that module is gated behind.
aws-sdk-ec2 = { version = "1", default-features = false, features = ["behavior-version-latest"] }
# The AWS SDK for Amazon S3, driven over the same in-process callback: exporting a
# serverless cache snapshot writes its data set into a bucket, and buckets and objects
# belong to Amazon S3, so `src/state/s3_export.rs` writes it where that service holds
# it. Only the generated client is needed — the emulator supplies the transport.
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest"] }
# The AWS SDK for Amazon SNS, driven over the same in-process callback: a cache
# cluster's events are published to the topic its `NotificationConfiguration`
# names, and topics and their subscriptions belong to Amazon SNS, so
# `src/state/event_notifications.rs` publishes where that service holds them.
# Only the generated client is needed — the emulator supplies the transport.
aws-sdk-sns = { version = "1", default-features = false, features = ["behavior-version-latest"] }
# `arn::region_label`: the ONE reading of a caller-supplied Region as a Region
# LABEL, which is what the endpoint the EC2 call above is made at is built from.
service-common = { path = "../common" }
# The EC2 service's OWN state accessor, for the two facts about this service's
# resources that live in Amazon VPC's inventory rather than here: the subnets a
# cache subnet group's membership re-derives from (`src/state/ec2_live_subnets.rs`),
# and the requester-managed network interface each cache node holds in its subnet
# (`src/state/ec2_cache_node_interfaces.rs`) — an interface another service created
# and manages is that store's own record, so it is written where
# `ec2:DescribeNetworkInterfaces` answers from rather than into a second copy here.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# The RESP wire format (RESP2/RESP3) a cache's own clients speak, decoded and
# encoded by the protocol's own implementation rather than by a reading of it
# written here: `src/state/cache_data_plane/resp_frame.rs` frames every command a
# client sends and every reply the cache answers with.
redis-protocol = { version = "6.0.0", default-features = false, features = ["std", "resp2", "resp3"] }
# The Amazon CloudWatch Logs store, which holds the log groups a cache's logs are
# delivered to: a slow-log `LogDeliveryConfiguration` names a log group by name, and
# the records the engine's slow log produces are written where `logs:FilterLogEvents`
# and `logs:GetLogEvents` answer from
# (`src/state/cache_data_plane/slow_log.rs`), the way the EC2 store above is read.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# `src/service/authorization.rs` resolves WHO a request speaks for from the same place
# `sts:GetCallerIdentity` answers from, and reads the identity-based policies, the
# permissions boundary and the session policies in force on that principal through STS's
# own view of the IAM store on the same engine.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The `application/x-www-form-urlencoded` parameter list an awsQuery request's body is,
# read by the crate that decodes that media type rather than by a split of the bytes: the
# authorization gate reads the identifier its request addresses a resource by out of it
# (`src/service/authorization.rs`).
form_urlencoded = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-sns = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The integration tests are ONE cargo target rooted at `tests/all/main.rs`, which
# declares every suite under `tests/all/` from its file name, so a new suite is a new
# file and nothing lists it.
automod = { workspace = true }
# The encryption suite mounts KMS beside ElastiCache on one engine, because
# resolving the key a resource names is a call into it.
service-com-amazonaws-kms-trentservice = { workspace = true }
# Amazon S3, mounted beside this one in the test harness: the object an export of a
# serverless cache snapshot writes is read back through that service's OWN operations,
# so what the export reports is what the owner of objects really holds.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# Amazon SNS, mounted beside this one in the test harness: the notification a cluster
# event owes is delivered by Amazon SNS, so what this service publishes is read back
# from the service that owns topics and their deliveries.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# Amazon SQS, mounted beside Amazon SNS in the same harness: the subscriber's end of
# the delivery path a notification travels, so the suite reads the envelope a client
# really receives off a queue rather than only what was published.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# The SQS client that harness drives the subscriber's end with.
aws-sdk-sqs = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The data-plane suite drives a real RESP client against a cache's own socket in ONE
# process: `rustls` / `tokio-rustls` run the client side of the TLS a cache with
# in-transit encryption is served over, which the core terminates. Both are the versions
# this workspace already builds.
rustls = { workspace = true }
tokio-rustls = "0.26"
# IAM, mounted beside this one in the authorization suite: the role, its inline policy and
# its permissions boundary are that service's own records, which is where the gate reads the
# documents in force on the caller from.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# ... and STS beside it: the assumed-role session a request signs with is that service's own
# record, which is where the gate resolves the principal an access key id speaks for.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[lints]
workspace = true
