[package]
name = "service-com-amazonaws-ssm-amazonssm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# Plain, not `workspace = true`: the workspace's own tokio entry ADDS "rt-multi-thread"
# (and "macros") on top of whatever a dependent lists, and `tokio` itself refuses to build
# "rt-multi-thread" for `wasm32`. The native extra is restored below instead.
tokio = { version = "1", features = ["time", "sync"] }
bytes = { workspace = true }
http = { workspace = true }
# `raw_value` is what lets the one body this service writes a member onto be read and
# written back value by value as the BYTES it already carried, so nothing else about it —
# a timestamp's own digits above all — is re-rendered (`service::recorded_response_members`).
serde_json = { workspace = true, features = ["raw_value"] }
tracing = { workspace = true }
# `PutParameter`'s AllowedPattern is a regular expression the value must satisfy.
# The floor matches the version the vendored framework pins, so the tree resolves one.
regex = "1.12"
# `arn::parse_of`: the one parse a service reads a caller-supplied resource ARN with,
# which `DescribeDocument`'s `DocumentARN` name may be.
service-common = { path = "../common" }
# A `SecureString`'s value is sealed under a key the KMS service holds: whether a read may
# have it decrypted for its caller is that key's own policy decision, read through KMS's
# own state accessors rather than from a second copy of them here.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The image catalog Amazon EC2 publishes: the AWS-published parameters of the `/aws`
# hierarchy resolve to the ids of the images that service holds, which is the one place
# this emulator records which AMI a public parameter names.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# The secrets Secrets Manager holds: a read of the reserved `/aws/reference/secretsmanager`
# hierarchy is a read of that service's own secret — its authorization gate, its versions'
# staging labels and its envelope — rather than of any parameter this service stores
# (`state::secretsmanager_reference`).
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }
# `CreateDocument`'s content is "in JSON or YAML format", and the document's schema
# version, description and parameters are read out of it. yaml-rust2 is a pure-Rust
# YAML 1.2 implementation, and YAML 1.2 is a superset of JSON, so one parser reads
# either spelling of the same document.
yaml-rust2 = { version = "0.10", default-features = false }
# `DocumentDescription$Hash` is "the Sha256 … hash created by the system when the
# document was created", rendered hex.
sha2 = { workspace = true }
hex = { workspace = true }
# Whether the caller's identity-based policies allow a just-in-time node access call is
# decided from the documents IAM holds for that principal and the session STS resolves the
# request's access key id to, read through those services' own state accessors rather than
# from a second copy of them here (`state::identity_authorization`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# A maintenance window's `Schedule` is "a cron or rate expression", so the instants it
# opens at are read by this maintained cron grammar rather than by a hand-written one.
cron = "0.15"
# `chrono` is what that parser is written in, and what reads the ISO-8601 Extended instants
# a window states its activation and its one-time schedule with.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# A window's schedule is evaluated "in Internet Assigned Numbers Authority (IANA) format"
# time zone, whose database this crate carries.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# The CONTAINED Python interpreter an `aws:executeScript` step's own script is executed by,
# and the generic in-process AWS API seam an `aws:executeAwsApi` step's call is dispatched
# through — both reached through the Lambda service crate, which is where this workspace's
# ONE embedded execution substrate and its ONE in-process AWS API dispatcher live
# (`state::execution::python`, `state::execution::aws_api`). Reused rather than stood up a
# second time here, so a runbook's script runs under exactly the containment and the bounds
# that engine already enforces, and this crate adds no execution surface of its own: it
# supplies the script's source, the handler to call, the input payload and the ceilings
# (`crate::state::automation::actions`) and nothing else.
#
# Capability class: an execution substrate. What it re-opens is answered by that engine and
# by this crate's own module docs — the interpreter is built with the engine crate's
# host-reaching features compiled out, its native modules are an allow-list that leaves
# every socket, subprocess, memory-map and host-library module unregistered, the
# operating-system modules a script can import are the workspace's own in-memory ones, and
# every bound (wall clock, steps, memory, recursion, output size) lives in host code no
# script can reach. It brings no build-time code of its own beyond the generated service
# scaffolding every service crate here builds.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# The `aws:changeInstanceState` step of an Automation runbook brings the instances it names
# to the desired state by calling Amazon EC2 itself, whose awsQuery answers are XML
# documents; roxmltree is the pure-Rust XML reader this tree already uses for them.
roxmltree = "0.20"
# An awsQuery request's parameters are a form body, so each one is percent-encoded the way
# an AWS SDK sends it and the SigV4 canonical request assumes.
percent-encoding = "2"
# A Change Calendar document's content is an iCalendar (RFC 5545) entry, so `GetCalendarState`
# reads it with this maintained iCalendar reader — line unfolding, parameters and escaping
# included — rather than with a hand-written one.
icalendar = "0.17"
# The RRULE of a recurring calendar entry, expanded by the maintained RFC 5545 recurrence
# implementation rather than by a hand-written one.
rrule = "0.14"
# An entry's `DURATION` is an ISO-8601 duration, read by the maintained ISO-8601 reader.
iso8601 = "0.6"
# The DNS a script delivered to a node's guest resolves a name through: which addresses answer
# one inside the node's VPC, what the security groups on a Resolver endpoint admit, and what
# the private hosted zones associated with that VPC hold, read through that service's own
# state accessors rather than from a second copy of them here (`state::guest_resolver`).
service-com-amazonaws-route53resolver-route53resolver = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["time", "sync"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# One module per `tests/all/<name>.rs`, so a new suite is a new file: this crate's tests
# are the single `all` target rooted at `tests/all/main.rs`.
automod = { workspace = true }
# The suite about the DNS a node's guest resolves a name through creates the private hosted
# zone and its records over Route 53's own front door.
service-com-amazonaws-route53-awsdnsv20130401 = { workspace = true }

[lints]
workspace = true
