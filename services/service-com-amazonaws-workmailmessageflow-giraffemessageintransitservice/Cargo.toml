[package]
name = "service-com-amazonaws-workmailmessageflow-giraffemessageintransitservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# WASM-EMBEDDED EXPERIMENT: the workspace tokio feature set includes "rt-multi-thread",
# unsupported on wasm32; split the wasm-safe subset out here, full set added back natively.
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The Amazon S3 object store: the MIME content `PutRawMessageContent` installs comes out
# of the S3 object its `S3Reference` names, which S3 owns, so the reference is resolved
# against S3's own state in the shared engine rather than against a copy kept here.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# AMAZON WORKMAIL: an in-transit message is in the email flow of one WorkMail
# organization, and that organization — with the mailboxes the arriving mail is for — is
# WorkMail's resource, so the delivery that puts a message in transit (`state::email_flow`)
# resolves it against WorkMail's own state in the shared engine rather than against a copy
# kept here.
service-com-amazonaws-workmail-workmailservice = { workspace = true }
# The tree's one evaluation of IAM policy documents: whether the bucket holding the
# referenced object grants WorkMail the read is a resource-policy decision, and two services
# must not read one document differently. Its `ses_identities` is also the one reading of a
# mail address, which is how a delivery's recipient is matched to a mailbox.
service-common = { path = "../common" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
