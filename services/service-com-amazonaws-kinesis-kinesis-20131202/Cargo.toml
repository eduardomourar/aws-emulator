[package]
name = "service-com-amazonaws-kinesis-kinesis-20131202"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# WASM-EMBEDDED EXPERIMENT: the workspace tokio feature set includes "rt-multi-thread",
# unsupported on wasm32; split the wasm-safe subset out here, full set added back natively.
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Reads the top-level members of a request body in the CBOR representation of this service's
# protocol: the CBOR implementation the framework's own codec is built on, pinned to the same
# release that codec carries so the two cannot disagree about where one item ends and the next
# begins (`crate::service::unreadable_values`), and the encoder the CBOR suite builds request
# bodies with.
aws-smithy-cbor = "=0.62.2"
# Encodes the opaque pagination token a truncated shard listing hands back.
hex = { workspace = true }
# The hash that places a data record in a shard: "an MD5 hash function is used to map
# partition keys to 128-bit integer values and to map associated data records to shards"
# (`PutRecordInput$PartitionKey`).
md-5 = "0.10"
# Folds a channel's region, name and creation instant into the short opaque `ChannelId` a
# read reports (`crate::state::channel_id`).
sha2 = { workspace = true }
# Resolves the `KeyId` a `StartStreamEncryption` request names against KMS, over the
# emulator's own in-process transport, before the stream is reported as encrypted under it.
# WASM-EMBEDDED EXPERIMENT: "rt-tokio" unconditionally sets `tokio?/fs` (aws-smithy-types'
# own feature definition, not ours to change), unsupported on wasm32; dropped here and
# added back only for native below.
aws-sdk-kms = { version = "1", default-features = false, features = ["behavior-version-latest"] }
# The AWS SDK for Amazon S3, driven over the same in-process callback: a channel with a
# general purpose bucket destination writes the objects it delivers through Amazon S3's own
# data plane, which is the one object store in this emulator
# (`crate::state::channel_delivery`).
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest"] }
# The UTC calendar fields the key of a delivered object carries, read from a maintained date
# library rather than computed here.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The `GZIP` compression a destination's `CompressionType` can ask a delivered object for.
flate2 = "1"
# The `ZSTD` compression it can ask for. Pure Rust, like `flate2`: the emulator links no
# native compression library.
ruzstd = "0.9"
# The one place this tree states the Region LABEL grammar, for the caller-supplied region
# that ends up in the authority of the KMS endpoint the lookup above is routed on.
service-common = { path = "../common" }
# A channel with a streaming table destination creates that table in S3 Tables, which owns
# every table record: the create writes it through that service's own state.
service-com-amazonaws-s3tables-s3tablebuckets = { workspace = true }
# A stream's data plane publishes its own `AWS/Kinesis` series — what producers wrote, what
# consumers read, how far behind a consumer is — into the CloudWatch store, which is the one
# place a client reads a metric from (`crate::state::stream_metrics`).
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# Who a request's credential speaks for: the session the token service minted that access key
# id for, which is what an authorization decision is taken about.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# What that principal may do: the identity-based policy documents and the permissions
# boundary IAM holds for it, read through IAM's own accessors.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# Decodes one `application/vnd.amazon.eventstream` frame, so the enhanced fan-out suite reads
# the frames `SubscribeToShard` answers with the way an SDK's decoder does.
aws-smithy-eventstream = "0.60"
# The encryption suites mount the KMS service beside Kinesis on one engine, because
# `StartStreamEncryption` resolves the `KeyId` it is given by calling it.
service-com-amazonaws-kms-trentservice = { workspace = true }

[lints]
workspace = true
