[package]
name = "service-com-amazonaws-ecrpublic-spencerfrontendservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# Plain, not `workspace = true`: the workspace's own tokio entry ADDS "rt-multi-thread"
# (and "macros") on top of whatever a dependent lists, and `tokio` itself refuses to build
# "rt-multi-thread" for `wasm32`. The native extra is restored below instead.
tokio = { version = "1", features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
# Speaks HTTP/1.1 on the raw connection the core hands the socket every published `logoUrl`
# names, with the encoder's title-case option set so the asset's media type reaches a client
# under the field name it reads (`src/state/logo_socket.rs`). `hyper-util` carries the tokio
# IO and timer adapters for it, `http-body-util` the bounded body reader and the one-shot body.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde_json = { workspace = true }
tracing = { workspace = true }
# The `sha256:` manifest digest an image is identified by, and the logo payload digest.
sha2 = { workspace = true }
# Hex encoding for the manifest digest and for the opaque pagination tokens.
hex = { workspace = true }
# Reads the pixel dimensions out of an uploaded image's own header, which is what the
# repository logo's dimension floor is decided against.
imagesize = "0.15"
# `iam_authorization`: the shared evaluation of IAM policy documents against
# (action, resource), which every operation's authorization gate runs.
service-common = { path = "../common" }
# The IAM store holds the identity-based policies of the principal a request speaks
# for, and the STS store resolves which principal that is: this service reads both
# services' OWN state accessors rather than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["sync", "time"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
