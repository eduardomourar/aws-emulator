[package]
name = "service-com-amazonaws-codebuild-codebuild-20161006"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# WASM-EMBEDDED EXPERIMENT: the workspace tokio feature set includes "rt-multi-thread",
# unsupported on wasm32; split the wasm-safe subset out here, full set added back natively.
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# A StartBuild idempotency entry keeps a fixed-size SHA-256 of the request it was
# issued for, rather than the request itself; the same digest derives a build's
# RFC 9562 version-8 id.
sha2 = { workspace = true }
hex = { workspace = true }
# `iam_role`: the workspace's ONE reading of a caller-supplied IAM role ARN — which role
# of this account it names, and whether that role's trust policy admits a service
# principal — which `CreateProject` and `StartBuild` ask before storing a project or
# starting a build that would RUN AS the role the request hands over.
service-common = { path = "../common" }
# `aws-sdk-s3`: a build uploads its output artifacts to the bucket those artifacts name,
# so `StartBuild` and `StartBuildBatch` resolve that bucket against the service that owns
# buckets (S3's `HeadBucket`). A LIBRARY: it opens no connection of its own here — the
# client is built over the framework's in-process callback (its HTTP client and
# credentials provider), so the call is dispatched inside this emulator and reaches no
# host off it. `default-features = false` keeps the default TLS and connector stacks out.
aws-sdk-s3 = { version = "1", default-features = false }
# `yaml-rust2`: a project's buildspec is YAML, and the `batch` section of it is what
# declares the builds a batch build fans out into; yaml-rust2 is the pure-Rust YAML 1.2
# implementation the other services in this workspace read caller-supplied YAML with (a
# DATA-FORMAT PARSER, not an execution substrate: no `unsafe`, no C, no build script).
# The text it is handed is bounded first — see `crate::state`'s batchspec reading.
yaml-rust2 = { version = "0.10", default-features = false }
# `zip`: a build's S3 source is "a ZIP file that contains the source code", and the
# artifacts whose packaging is ZIP — and the cache a project carries between builds — are
# the same form, so this is the codec for both directions. A DATA-FORMAT codec, with only
# the deflate method linked.
zip = { version = "9", default-features = false, features = ["deflate"] }
# `globset`: a buildspec's `artifacts/files` and `cache/paths` are glob patterns matched
# against the files a build produced; globset is the pure-Rust glob matcher this
# workspace already matches caller-supplied patterns with.
globset = "0.4"
# `md-5`: the checksums a build reports for an artifact whose packaging is ZIP are of the
# archive's own bytes (`BuildArtifacts$md5sum`, `$sha256sum`).
md-5 = "0.10"
# The AWS Secrets Manager service, for the two verdicts a build environment's
# `SECRETS_MANAGER` variable turns on: whether the project's SERVICE ROLE may retrieve the
# secret the variable references, and whether that account holds a value to retrieve at all,
# which together decide whether the build environment can be provisioned at all
# (`crate::state::build_secrets`). The secret, the policies on it and its deletion state are
# that service's own records, held in its own store in the shared engine, so the decision is
# answered by the service that owns them rather than by a copy kept here. No cycle: that
# crate does not depend on this one.
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }
# The CloudWatch store holds the `AWS/CodeBuild` series this service publishes about the
# builds it ran (`state::build_metrics`): the datapoints are appended to the very store
# `GetMetricStatistics` and `ListMetrics` read, because CloudWatch refuses a publish into an
# `AWS/` namespace over `PutMetricData`. No cycle: that crate does not depend on this one.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The AWS SDK for Secrets Manager, driven over the in-process callback: the VALUE a
# `SECRETS_MANAGER` variable is substituted with is read through that service's own
# `GetSecretValue` before the build's first command runs, so what the build's shell sees is
# the value a client reads back from the service that holds it. Only the generated client is
# needed — the emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-secretsmanager = { version = "1", default-features = false }
# The AWS SDK for Amazon ECR, driven over the same in-process callback: a build's own
# commands log in to that registry and push the image they built to it
# (`crate::state::build_tools`), which is that service's `GetAuthorizationToken`, its layer
# uploads and its `PutImage`. A LIBRARY: it opens no connection of its own here.
aws-sdk-ecr = { version = "1", default-features = false }
# `tar` and `flate2`: a container image's layer is a gzip-compressed tar archive, so the
# image a build's `docker build` composes out of its working tree is archived and compressed
# with the codecs this workspace already reads and writes those formats with. DATA-FORMAT
# codecs, both pure Rust.
tar = "0.4"
flate2 = "1"
# The AWS SDK for EventBridge, driven over the in-process callback: every change of a
# build's state is published onto the account's default event bus
# (`crate::state::build_events`), which is that service's `PutEvents`. Only the generated
# client is needed — the emulator supplies the transport, so the SDK's own HTTPS stack is
# left out and the client can reach nothing off this process.
aws-sdk-eventbridge = { version = "1", default-features = false }
# `roxmltree`: the test-result and code-coverage files a build's `reports` sections declare
# are XML documents the build's own commands wrote (JUnit, NUnit, TestNG, Visual Studio,
# JaCoCo, Cobertura, Clover), and roxmltree is the pure-Rust, read-only XML reader this
# workspace already reads caller-supplied XML with. A DATA-FORMAT PARSER, not an execution
# substrate: no `unsafe`, no C and no build script, and it resolves no external entity.
roxmltree = "0.20"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares tests/all/main.rs's suite modules, one per tests/all/<name>.rs.
automod = { workspace = true }
# The settle test has to let real time pass; the timer is enabled for the test
# targets only, so the production dependency does not carry it.
tokio = { workspace = true, features = ["time"] }
# The suite that drives a build's own ECR login and image push end to end mounts the two
# services that own what the build's commands reach: IAM holds the service role's policies,
# and Amazon ECR holds the registry the push uploads to. Test-only: the service code reaches
# ECR through the AWS SDK over the in-process callback, never through that crate.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-ecr-amazonec2containerregistry-v20150921 = { workspace = true }
# The suite that reads a build's own log events back mounts the service that HOLDS them:
# a build's output is delivered to CloudWatch Logs, so what the group and stream a build
# reports hold afterwards is read through that service's own reads.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# The suite that reads a build's own state-change events back mounts the two services that
# carry them: EventBridge holds the bus and the rules the events are routed by, and Amazon
# SQS holds the queue a rule's target delivers to. Test-only: the service code publishes
# through the AWS SDK over the in-process callback, never through these crates.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[lints]
workspace = true
