[package]
name = "service-com-amazonaws-dynamodbstreams-dynamodbstreams-20120810"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `arn`: the one parse a caller-supplied resource ARN is read against, so the form a
# stream ARN has to take is judged the same way every other service judges an ARN.
service-common = { path = "../common" }
# Shard ids, event ids and shard-iterator tokens are SHA-256 digests of the
# resource coordinates they name, so they are opaque yet reproducible.
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
