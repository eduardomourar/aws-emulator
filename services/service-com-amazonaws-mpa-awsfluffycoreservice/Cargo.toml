[package]
name = "service-com-amazonaws-mpa-awsfluffycoreservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# `service-common` carries the ONE reading of the UTC offset an RFC 3339 timestamp
# declares, which the `InitiationTime` filter values of `ListSessions` are read through.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# WASM-EMBEDDED EXPERIMENT: the workspace tokio feature set includes "rt-multi-thread",
# unsupported on wasm32; split the wasm-safe subset out here, full set added back natively.
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# AWS Organizations is mounted beside this service on one engine in every suite that
# creates an approval team or an identity source, because the organization whose
# MANAGEMENT ACCOUNT those creates are restricted to is that service's own record: the
# gate reads it over the in-process callback, so the organization a suite needs is
# created through Organizations' own `CreateOrganization` rather than seeded here.
service-com-amazonaws-organizations-awsorganizationsv20161128 = { workspace = true }

[lints]
workspace = true
