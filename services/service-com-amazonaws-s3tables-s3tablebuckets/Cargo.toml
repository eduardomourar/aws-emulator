[package]
name = "service-com-amazonaws-s3tables-s3tablebuckets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# WASM-EMBEDDED EXPERIMENT: the workspace tokio feature set includes "rt-multi-thread",
# unsupported on wasm32; split the wasm-safe subset out here, full set added back natively.
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Digest + hex encoding for the opaque continuation token a list operation pages with,
# and the entropy behind every server-generated identifier this service mints.
sha2 = { workspace = true }
hex = { workspace = true }
# Lays those digest bytes out as the canonical hyphenated UUID this service's ids are,
# and writes the version and variant nibbles such a UUID carries.
uuid = "1"
# Percent-encodes the warehouse ARN the Iceberg REST catalog answers as its path prefix:
# that value is a PATH SEGMENT of every later catalog request, so its `:` and `/` travel
# escaped, and the escaping is this crate's rather than a hand-rolled table.
percent-encoding = "2"
# `date_time_json`: the workspace's ONE rendering of a `restJson1` timestamp whose model
# declares the `date-time` form, which every timestamp member of this model does.
# `iam_authorization`: the shared evaluation of a principal's policy documents against an
# action on a resource, so every service that enforces authorization decides alike.
service-common = { path = "../common" }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The KMS store, for the customer managed key an SSE-KMS encryption configuration names:
# whether KMS resolves it for the caller is what decides a put of that configuration.
service-com-amazonaws-kms-trentservice = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }

[dev-dependencies]
# The bounded, seeded generator behind the generated maintenance-configuration
# rows in `tests/all/table_maintenance_put_round_trip.rs`.
rand = "0.9"
# Declares one module per `tests/all/<name>.rs`, so this crate's one integration
# target needs no hand-kept register of its suites.
automod = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
