[package]
name = "service-com-amazonaws-xray-awsxray"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# WASM-EMBEDDED EXPERIMENT: the workspace tokio feature set includes "rt-multi-thread",
# unsupported on wasm32; split the wasm-safe subset out here, full set added back natively.
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
bytes = { workspace = true }
http = { workspace = true }
# `preserve_order`: every reader that reports a stored segment document answers
# it with its members in the order the document named them (`src/state/
# segment_document.rs`); with the feature off a JSON object is held as a sorted
# map and an assembled document would name them in an order no client sent, so
# this crate declares the feature its own answers depend on rather than
# inheriting it from another crate's manifest.
serde_json = { workspace = true, features = ["preserve_order"] }
tracing = { workspace = true }
# `stable_hex_id`: the one deterministic mixing function a service derives a
# wire-visible id with, rather than a copy per crate.
# `iam_authorization`: the shared evaluation of IAM policy documents against an
# action on a resource, so this service's authorization gate
# (`src/service/authorization.rs`) reads a document exactly as every other
# service does, and states a refusal in the same words.
# `iam_role`: which IAM entity a principal ARN names. `arn`: whether a value the
# request carries is an ARN of this service.
service-common = { path = "../common" }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The store an accepted span is DELIVERED to while the account's trace segment
# destination is CloudWatch Logs — the one CloudWatch Logs' own readers answer
# from, so a delivered span and `FilterLogEvents` cannot disagree.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# `DescribeKey`: the read that resolves the KMS key selector a
# `PutEncryptionConfig` names to the key whose ARN the configuration reports.
# WASM-EMBEDDED EXPERIMENT: "rt-tokio" unconditionally sets `tokio?/fs` (aws-smithy-types'
# own feature definition, not ours to change), unsupported on wasm32; dropped here and
# added back only for native below.
aws-sdk-kms = { version = "1", default-features = false, features = ["behavior-version-latest"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The KMS this emulator's own X-Ray resolves an encryption key selector
# through, mounted beside it on one engine so the key the configuration reports
# is the key KMS holds.
service-com-amazonaws-kms-trentservice = { workspace = true }

[lints]
workspace = true
