[package]
name = "service-com-amazonaws-appconfig-amazonappconfig"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time`: a `LAMBDA` validator's invocation is clamped by a budget of its own
# (`state::validators`), because the client it is made with has no timeout behind it.
# WASM-EMBEDDED EXPERIMENT: `workspace = true` ADDS to (not replaces) the workspace's base
# tokio spec, which includes `rt-multi-thread` -- unsupported on wasm32 -- so this is split
# the same way vendor/server's Cargo.toml is.
tokio = { version = "1", features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Codec for the opaque pagination cursors `state::paginate` mints and reads back.
hex = { workspace = true }
# `arn`: the ONE parse of a resource ARN, shared with every other service — an
# extension action's target URI is read through it rather than split here.
# `validation`: the one collecting walk a service that words its own pre-handler refusal
# uses, which restores each violation's value echo to the bytes the caller sent
# (`service.rs`).
service-common = { path = "../common" }
# The `Content` an extension action-point event carries is base64, and a replacement
# `Content` the action answers with is decoded the same way
# (`state::extension_actions`).
base64 = "0.22"
# The AWS SDKs for the four target kinds an extension action's `Uri` may name, each
# driven over the in-process callback (`OperationContext::callback`): a Lambda function
# (`Invoke`, the one kind that can answer the action point), an Amazon SQS queue
# (`SendMessage`), an Amazon SNS topic (`Publish`) and an Amazon EventBridge event bus
# (`PutEvents`). Only the generated clients are needed — the emulator supplies the
# transport, so the SDKs' own HTTPS stacks and runtimes are left out.
aws-sdk-lambda = { version = "1", default-features = false }
aws-sdk-sqs = { version = "1", default-features = false }
aws-sdk-sns = { version = "1", default-features = false }
aws-sdk-eventbridge = { version = "1", default-features = false }
# The SDK's `RequestId`, to report the Lambda request id of a failed action-point
# invocation in the refusal the gated call answers with.
aws-types = { version = "1", default-features = false }
# JSON Schema evaluator: the verdict a `JSON_SCHEMA` validator of a configuration
# profile gives about a candidate configuration (`state::validators`), and the one a
# feature flag's declared attribute constraints give about its authored values
# (`state::feature_flags`).
boon = "0.6"
# Where one target of a gradual rollout stands is derived from the key that identifies
# that target, by hashing it (`state::rollout`).
sha2 = { workspace = true }
# The CloudWatch store an environment's `Monitors` are judged against: a monitored
# deployment is rolled back while the alarm its environment names is in ALARM, and that
# alarm's state belongs to CloudWatch's own records (`state::alarm_monitors`).
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The IAM store a monitor's `AlarmRoleArn` is resolved against: whether the role's trust
# policy lets AppConfig assume it, and so whether the alarm can be monitored at all
# (`state::alarm_monitors`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The Parameter Store a configuration profile whose `LocationUri` is
# `ssm-parameter://<parameter name>` (or a parameter ARN) deploys its configuration from:
# the content a reader of that deployed configuration serves is the named parameter
# version's value, read through that service's own state accessors rather than from a
# second copy of them here (`state::configuration_sources`).
service-com-amazonaws-ssm-amazonssm = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs` file, so a new suite is picked up by
# adding the file.
automod = { workspace = true }
# `tokio::time` drives the tests' wait past an action point's due instant.
tokio = { workspace = true, features = ["time"] }
# Percent-encoding for the `awsQuery` form body an IAM request travels in: the monitor
# role a deployment is watched under is created through IAM's own `CreateRole`.
percent-encoding = "2.3"
# An extension action's target lives in another service, and an invocation is asserted
# where a client sees it: on the queue the action's `Uri` names, and against the Lambda
# function it names.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# AppConfig's own DATA plane: what a rollback leaves in service is read where a running
# application reads it, through a configuration session rather than through this service's
# deprecated `GetConfiguration` (`tests/all/deployment_tick_directive.rs`).
service-com-amazonaws-appconfigdata-appconfigdata = { workspace = true }
# The deployment package the tick suite uploads for its steering function is a .zip
# archive it writes in memory, the way a caller uploads one.
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
