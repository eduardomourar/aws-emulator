    <!--
      A literal, static tag — not one `document.write`d in from a `<script>` — because
      the browser's speculative preload scanner reads these raw HTML bytes before any
      script on the page runs at all: a `<base>` written in by JS doesn't exist yet from
      the scanner's point of view, so it resolves every `<script src>`/`<link href>`
      below against the page's OWN url instead, firing a real (if harmless — the
      scanner's hits are speculative preload hints, never the actual module graph; see
      `assets/react-vendor-*.js`'s own comment on the one place that distinction
      actually matters) 404 for each one on a GitHub Pages project site. A literal tag
      has no such gap. Every resource reference below is relative to it rather than
      rooted at the origin — a rooted "/assets/..." reference 404s on a GitHub Pages
      project site, since the origin's real root is one path segment above where this
      site actually lives; per spec, `document.baseURI` otherwise tracks `location`,
      which Floci's client-side router changes via `history.pushState` without a real
      navigation, so a relative URL resolved with no `<base>` at all would drift right
      along with it.

      Fixed at "/aws-emulator/" rather than computed from the request, because both
      places this is ever served from use that same path now: `serve.py`, for local
      testing, mirrors it for exactly this reason (see its own comment).
    -->
    <base href="/aws-emulator/">
    <script>
      // Read by a one-line patch in the vendored `assets/react-vendor-*.js` (see its
      // own comment) where Floci's router component's `basename` prop defaults to the
      // LITERAL "/": Floci's own code never passes a `basename` prop at all, so every
      // `<Link>` click and programmatic navigation lands on that default — unprefixed.
      // NOT interchangeable with the `<base>` tag above despite the same value: that
      // one needs the trailing slash a relative URL resolves against; this one must NOT
      // carry one — React Router strips exactly this STRING as a prefix of
      // `location.pathname`, so a trailing slash here would leave a path that starts
      // with "/" one segment short of every route's own leading "/".
      window.__ROUTER_BASENAME__ = "/aws-emulator";
    </script>
    <script>
      (function () {
        var t = localStorage.getItem("floci-theme");
        var theme = t === "system"
          ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : (t === "light" ? "light" : "dark");
        document.documentElement.setAttribute(
          "data-theme",
          theme,
        );
      })();
    </script>
