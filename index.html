    <!--
      An explicit `<base>`, computed once from the page's OWN initial load path (never
      from a later `history.pushState`, which Floci's client-side router uses to change
      `location.pathname` without a real navigation): per spec, `document.baseURI` only
      tracks `location` when no `<base>` element is present, so setting one here freezes
      it for the whole session. Every resource reference below is relative to it rather
      than rooted at the origin, so the same `index.html` serves correctly both locally
      (served at `/`) and as a GitHub Pages project site (served at `/aws-emulator/`) —
      a rooted "/assets/..." reference 404s on the latter, since the origin's real root
      is one path segment above where this site actually lives. Checked once, here,
      before anything below resolves a single relative URL against it (an import map's
      bare-specifier resolution in particular happens at each `import`, against
      whatever `document.baseURI` is AT THAT MOMENT — not frozen at page-parse time —
      which is exactly what made a plain relative import-map value unsafe before this
      tag existed: it drifted with `pushState` same as everything else did).
    -->
    <script>
      document.write(
        '<base href="' +
          (location.pathname.indexOf("/aws-emulator/") === 0 ? "/aws-emulator/" : "/") +
          '">',
      );
    </script>
    <script>
      (function () {
        var t = localStorage.getItem("floci-theme");
        var theme = t === "system"
          ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : (t === "light" ? "light" : "dark");
        document.documentElement.setAttribute(
          "data-theme",
          theme,
        );
      })();
    </script>
